<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLang(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLang("python")
    
    // using innerhtml is deprecated as while using it you will need to traverse whole tree before making a change 

    addLang("typescript")
    function addOptiLang(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLang("rust")

    // editing 
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = 'c++'
    const newli = document.createElement('li')
    newli.appendChild(document.createTextNode("c++"))
    secondLang.replaceWith(newli)

    // edit
    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>Ruby</li>'

    // remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>
</html>
