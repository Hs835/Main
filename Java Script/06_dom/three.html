<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style ="background-color: #212121; color: #fff; ">
    
</body>
</html>
<script>
    const div = document.createElement('div')
    div.className = "main"
    div.id = "test-div"
    div.style.backgroundColor ="aqua"
    div.style.padding ="1rem"
    div.setAttribute("title", "sample title")
    // div.innerText = "Learning DOM"
    // you should prefer the set attribute and createtextnode because when you use the built in ones like classname, id, innertext it overwrites the present value and also while doing so it does the entire task in two steps first bringing over the present value then overwriting it which in not optimized 
    const addText = document.createTextNode("Learning DOM")
    div.appendChild(addText)
    
    document.body.appendChild(div)
</script>
